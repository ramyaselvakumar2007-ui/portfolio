<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | KFC Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #E4002B; --bg: #0a0a0a; --glass: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .bg-glow { position: absolute; width: 400px; height: 400px; background: var(--primary); border-radius: 50%; filter: blur(150px); opacity: 0.2; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1; }
        
        .login-container { background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(20px); padding: 40px; border-radius: 20px; width: 400px; max-width: 90%; }
        .logo { text-align: center; font-size: 2.5rem; font-weight: 800; color: var(--primary); margin-bottom: 10px; text-transform: uppercase; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }
        
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #aaa; transition: 0.3s; font-weight: 600; }
        .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #ccc; }
        .input-group { position: relative; }
        .input-group i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #666; }
        .form-group input { width: 100%; padding: 12px 15px 12px 45px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); }
        
        .auth-btn { width: 100%; padding: 15px; background: var(--primary); border: none; color: #fff; font-size: 1rem; font-weight: 600; border-radius: 30px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .auth-btn:hover { box-shadow: 0 0 20px rgba(228,0,43,0.5); transform: translateY(-2px); }
        
        .error-msg { color: #ff4d4d; font-size: 0.85rem; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="login-container">
        <div class="logo">Admin</div>
        <p class="subtitle">KFC Premium Dashboard</p>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">Register</div>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" required>
                </div>
            </div>
            <button type="submit" class="auth-btn">Sign In</button>
            <div class="error-msg" id="login-error"></div>
        </form>

        <form id="register-form" style="display:none;">
            <div class="form-group">
                <label>Email</label>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="reg-email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password (Min 6 chars)</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-password" required>
                </div>
            </div>
            <button type="submit" class="auth-btn">Register</button>
            <div class="error-msg" id="reg-error"></div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9UKK-f9ylhLQx2JnWQJgCVm0LD77va7E",
            authDomain: "test-b9ced.firebaseapp.com",
            databaseURL: "https://test-b9ced-default-rtdb.firebaseio.com/",
            projectId: "test-b9ced",
            storageBucket: "test-b9ced.firebasestorage.app",
            messagingSenderId: "12433744712",
            appId: "1:12433744712:web:cfc435b9699b5957b8497d",
            measurementId: "G-F2BYPYC93C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.switchTab = (type) => {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            if(type === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            }
        };

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');
            errDiv.style.display = 'none';
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = 'admin.html';
            } catch(err) {
                errDiv.innerText = err.message;
                errDiv.style.display = 'block';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            const errDiv = document.getElementById('reg-error');
            errDiv.style.display = 'none';
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                // Save admin info to DB
                await set(ref(db, 'admins/' + userCredential.user.uid), {
                    email: email,
                    role: 'admin'
                });
                window.location.href = 'admin.html';
            } catch(err) {
                errDiv.innerText = err.message;
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
