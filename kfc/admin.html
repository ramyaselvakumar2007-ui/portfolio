<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KFC Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #E4002B; --bg: #0a0a0a; --glass: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; }
        
        .topbar { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .logout-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: var(--primary); color: #fff; }

        .container { padding: 30px; max-width: 1400px; margin: 0 auto; }
        h1 { margin-bottom: 30px; font-size: 2rem; }
        h1 span { color: var(--primary); }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--glass); border: 1px solid var(--border); padding: 25px; border-radius: 15px; transition: 0.3s; }
        .stat-card:hover { border-color: var(--primary); }
        .stat-card h3 { color: #aaa; font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .num { font-size: 2.5rem; font-weight: 800; color: var(--primary); }

        /* Charts */
        .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 40px; }
        .chart-box { background: var(--glass); border: 1px solid var(--border); padding: 20px; border-radius: 15px; }

        /* Filters */
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 250px; padding: 10px 15px; background: var(--glass); border: 1px solid var(--border); border-radius: 5px; color: #fff; outline: none; }
        .filter-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--border); color: #aaa; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Table */
        .table-box { background: var(--glass); border: 1px solid var(--border); border-radius: 15px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: rgba(0,0,0,0.5); padding: 15px; text-align: left; border-bottom: 1px solid var(--border); color: #aaa; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tr:hover td { background: rgba(228, 0, 43, 0.05); }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: inline-block; text-align: center; min-width: 100px; }
        .st-Pending { background: #ff980033; color: #ff9800; }
        .st-Accepted { background: #2196f333; color: #2196f3; }
        .st-Preparing { background: #ffeb3b33; color: #ffeb3b; }
        .st-Out For Delivery { background: #9c27b033; color: #9c27b0; }
        .st-Delivered { background: #4caf5033; color: #4caf50; }

        .action-btn { background: none; border: 1px solid var(--border); color: #fff; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 3px; transition: 0.2s; }
        .action-btn:hover { border-color: var(--primary); color: var(--primary); }
        .action-btn.del:hover { border-color: #f44336; color: #f44336; }

        /* Loading */
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; display:flex; justify-content:center; align-items:center; z-index:9999; transition: 0.5s; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="loading"><div class="spinner"></div></div>

    <div class="topbar">
        <div class="logo">KFC Admin</div>
        <button class="logout-btn" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="container">
        <h1>Dashboard <span>Overview</span></h1>

        <div class="stats-grid">
            <div class="stat-card"><h3>Total Orders</h3><div class="num" id="stat-total">0</div></div>
            <div class="stat-card"><h3>Pending</h3><div class="num" id="stat-pending" style="color:#ff9800">0</div></div>
            <div class="stat-card"><h3>Preparing</h3><div class="num" id="stat-preparing" style="color:#ffeb3b">0</div></div>
            <div class="stat-card"><h3>Delivered</h3><div class="num" id="stat-delivered" style="color:#4caf50">0</div></div>
            <div class="stat-card"><h3>Revenue</h3><div class="num" id="stat-revenue" style="color:#fff">$0</div></div>
        </div>

        <div class="charts-row">
            <div class="chart-box"><canvas id="revenueChart"></canvas></div>
            <div class="chart-box"><canvas id="statusChart"></canvas></div>
        </div>

        <h2 style="margin-bottom:20px;">Manage Orders</h2>
        <div class="controls">
            <input type="text" class="search-input" id="searchInput" placeholder="Search by Order ID, Name, Phone...">
            <button class="filter-btn active" onclick="filterOrders('All')">All</button>
            <button class="filter-btn" onclick="filterOrders('Pending')">Pending</button>
            <button class="filter-btn" onclick="filterOrders('Accepted')">Accepted</button>
            <button class="filter-btn" onclick="filterOrders('Preparing')">Preparing</button>
            <button class="filter-btn" onclick="filterOrders('Out For Delivery')">Out For Delivery</button>
            <button class="filter-btn" onclick="filterOrders('Delivered')">Delivered</button>
        </div>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9UKK-f9ylhLQx2JnWQJgCVm0LD77va7E",
            authDomain: "test-b9ced.firebaseapp.com",
            databaseURL: "https://test-b9ced-default-rtdb.firebaseio.com/",
            projectId: "test-b9ced",
            storageBucket: "test-b9ced.firebasestorage.app",
            messagingSenderId: "12433744712",
            appId: "1:12433744712:web:cfc435b9699b5957b8497d",
            measurementId: "G-F2BYPYC93C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentFilter = "All";
        let ordersData = {};
        let revenueChartInstance, statusChartInstance;

        // Auth Guard
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'admin-login.html';
            } else {
                document.getElementById('loading').style.display = 'none';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Realtime DB Listener
        const ordersRef = ref(db, 'orders');
        onValue(ordersRef, (snapshot) => {
            ordersData = snapshot.val() || {};
            updateDashboard();
            renderTable();
        });

        // Search & Filter Listeners
        document.getElementById('searchInput').addEventListener('input', renderTable);
        window.filterOrders = (status) => {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTable();
        };

        function updateDashboard() {
            let total = 0, pending = 0, preparing = 0, delivered = 0, revenue = 0;
            const revByDate = {};
            const statusCounts = { Pending: 0, Accepted: 0, Preparing: 0, 'Out For Delivery': 0, Delivered: 0 };

            Object.values(ordersData).forEach(o => {
                total++;
                if(o.orderStatus === 'Pending') pending++;
                if(o.orderStatus === 'Preparing') preparing++;
                if(o.orderStatus === 'Delivered') { delivered++; revenue += o.totalAmount; }
                
                statusCounts[o.orderStatus] = (statusCounts[o.orderStatus] || 0) + 1;
                
                const date = new Date(o.createdAt).toLocaleDateString();
                revByDate[date] = (revByDate[date] || 0) + o.totalAmount;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-preparing').innerText = preparing;
            document.getElementById('stat-delivered').innerText = delivered;
            document.getElementById('stat-revenue').innerText = `$${revenue.toFixed(2)}`;

            // Charts
            const labels = Object.keys(revByDate);
            const data = Object.values(revByDate);

            if(revenueChartInstance) revenueChartInstance.destroy();
            revenueChartInstance = new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Revenue ($)', data, backgroundColor: '#E4002B', borderRadius: 5 }] },
                options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { x: { ticks: { color: '#aaa' }, grid: { color: '#333' } }, y: { ticks: { color: '#aaa' }, grid: { color: '#333' } } } }
            });

            if(statusChartInstance) statusChartInstance.destroy();
            statusChartInstance = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: { labels: Object.keys(statusCounts), datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#ff9800', '#2196f3', '#ffeb3b', '#9c27b0', '#4caf50'], borderWidth: 0 }] },
                options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#fff', padding: 15 } } } }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('orders-tbody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            Object.entries(ordersData).forEach(([key, o]) => {
                // Filter
                if(currentFilter !== 'All' && o.orderStatus !== currentFilter) return;
                
                // Search
                if(search && !o.orderId.toLowerCase().includes(search) && !o.customerName.toLowerCase().includes(search) && !o.mobile.includes(search)) return;

                const statusClass = `st-${o.orderStatus}`;
                const nextStatus = {
                    'Pending': 'Accepted', 'Accepted': 'Preparing', 
                    'Preparing': 'Out For Delivery', 'Out For Delivery': 'Delivered'
                }[o.orderStatus];

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:600;color:var(--primary)">${o.orderId}</td>
                        <td>${o.customerName}</td>
                        <td>${o.mobile}</td>
                        <td>${o.email}</td>
                        <td style="max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${o.address}</td>
                        <td>$${o.totalAmount.toFixed(2)}</td>
                        <td>${new Date(o.createdAt).toLocaleDateString()}</td>
                        <td><span class="status-badge ${statusClass}">${o.orderStatus}</span></td>
                        <td style="min-width:200px;">
                            ${nextStatus ? `<button class="action-btn" onclick="updateStatus('${key}', '${nextStatus}')"><i class="fas fa-check"></i> ${nextStatus}</button>` : ''}
                            <button class="action-btn del" onclick="deleteOrder('${key}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        window.updateStatus = (key, status) => {
            update(ref(db, 'orders/' + key), { orderStatus: status });
        };

        window.deleteOrder = async (key) => {
            if(confirm("Are you sure you want to delete this order?")) {
                await remove(ref(db, 'orders/' + key));
            }
        };
    </script>
</body>
</html>
